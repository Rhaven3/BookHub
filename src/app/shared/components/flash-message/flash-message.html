@if (flashService.message(); as msg) {
  <div class="fixed top-24 right-6 z-50 w-full max-w-md px-2">

    <div
      class="flex items-start justify-between gap-4 rounded-xl bg-white shadow-lg border-l-4 p-4 transition-all duration-300"

      [class.border-[var(--color-terracotta)]]="msg.type === 'success'"
      [class.border-red-400]="msg.type === 'error'">

      <div class="flex-1">

        <h4 class="font-semibold text-[var(--color-primary)]">
          {{
            msg.type === 'success'
              ? 'Succès'
              : msg.type === 'error'
                ? 'Erreur'
                : msg.type === 'warning'
                  ? 'Attention'
                  : 'Information'
          }}
        </h4>

        <p class="mt-1 text-sm text-gray-600 leading-6">
          {{ msg.text }}
        </p>

      </div>

      <button
        (click)="flashService.message.set(null)"
        class="flex h-8 w-8 items-center justify-center rounded-lg text-gray-400 transition hover:bg-[var(--color-sand)] hover:text-[var(--color-primary)]">

        ✕
      </button>

    </div>

  </div>
}
