<div class="search-input-wrapper">
  <span class="search-input-icon">🔍</span>

  <input
    type="text"
    [placeholder]="placeholder()"
    [value]="value"
    class="search-input-field"
    (input)="onInput($event)"
  />

  @if (value) {
    <button
      type="button"
      class="search-input-clear"
      (click)="clear()"
      aria-label="Effacer la recherche"
    >
      ✕
    </button>
  }
</div>
