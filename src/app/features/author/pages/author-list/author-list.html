<section class="card max-w-lg mx-auto mt-10">

  <div class="border-b border-gray-200 pb-4 mb-4">
    <h2 class="text-xl font-semibold">Authors list</h2>
  </div>

  <ul class="divide-y divide-gray-200">

    @for (author of displayAuthors(); track author.id) {
      <li class="flex items-center justify-between py-4">
        <div><h3 class="text-lg font-medium">{{ author.fname }} {{ author.lname }}</h3></div>

        <div class="flex gap-2">
          <button class="btn-secondary">Edit</button>
          <button class="btn-danger">Delete</button>
        </div>
      </li>
    }
  </ul>

  <button class="btn-primary" (click)="createAuthor()">Create author</button>

</section>
