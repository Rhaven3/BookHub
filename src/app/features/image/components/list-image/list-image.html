<section class="max-w-lg mx-auto mt-10 overflow-hidden rounded-xl bg-white shadow-md">
  <div class="border-b border-gray-200 px-6 py-4">
    <h2 class="text-xl font-semibold text-gray-800">
      Liste des éléments
    </h2>

    <form class="mt-4">
      <div class="relative">
        <input
          [(ngModel)]="searchValue"
          (input)="searchImageByName(searchValue)"
          name="search"
          class="appearance-none border-2 pl-10 border-gray-300 hover:border-gray-400 transition-colors rounded-md w-full py-2 px-3 text-gray-800 leading-tight focus:outline-none focus:ring-purple-600 focus:border-purple-600"
          type="text"
          placeholder="Rechercher..."
        />

        <div class="absolute left-0 inset-y-0 flex items-center">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6 ml-3 text-gray-400"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            />
          </svg>
        </div>
      </div>
    </form>
  </div>

  <ul class="divide-y divide-gray-200">
    @for (img of displayImages(); track img.id) {
      <li class="flex items-center gap-4 px-6 py-4 hover:bg-gray-50 transition">

        <img
          [src]="getImageUrl(img.path)"
          [alt]="img.name"
          class="h-14 w-14 rounded-lg object-cover"
        />

        <h3 class="text-lg font-medium text-gray-800">
          {{ img.name }}
        </h3>

        <button
          (click)="deleteImage(img.id)"
          class="ml-auto rounded-lg bg-red-500 px-4 py-2 text-white hover:bg-red-600 transition"
        >
          Supprimer
        </button>

      </li>
    }
  </ul>
</section>
