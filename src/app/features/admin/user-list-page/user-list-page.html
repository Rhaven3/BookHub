<section class="section-page-admin">
  <div class="section-header">
    <h1 class="section-title">Gestion des adhérents</h1>
  </div>
  <div class="flex justify-between w-full">
    <app-search-input
      placeholder="Rechercher un adhérent..."
      (searchChange)="searchTerm.set($event)"
    />
    <button (click)="onCreate()" class="btn-primary">Ajouter un adhérent</button>
  </div>
  <div class="dashboard-card">
    <app-data-table [data]="users()" [columns]="columns" [trackBy]="trackByUserId" [searchTerm]="searchTerm()">
      <ng-template appColumn="lastName" let-user>{{ user.lastName }}</ng-template>
      <ng-template appColumn="firstName" let-user>{{ user.firstName }}</ng-template>
      <ng-template appColumn="email" let-user>{{ user.email }}</ng-template>
      <ng-template appColumn="phone" let-user>{{ user.phone }}</ng-template>

      <ng-template appColumn="role" let-user>
        @if (user.role === 'ADMIN') {
          <span class="badge-dark">Admin</span>
        } @else if (user.role === 'LIBRARIAN') {
          <span class="badge-info">Libraire</span>
        } @else {
          <span class="badge-soft">Utilisateur</span>

        }
      </ng-template>

      <ng-template appColumn="actions" let-user>
        <div class="flex items-center justify-between">
          <button type="button" class="btn-link" (click)="onEdit(user)">Modifier</button>
          <button type="button" class="admin-table-danger-link" (click)="onDelete(user)">Supprimer</button>
        </div>
      </ng-template>
    </app-data-table>
    <app-modal [isOpen]="isEditModalOpen()" title="Modifier les informations" (closeModal)="closeEditModal()">
      <app-edit-form
        [initialValue]="userToEdit()"
        [cancelRoute]="null"
        (cancel)="closeEditModal()"
        (submitForm)="onEditSubmit($event)"
      />
    </app-modal>
    <app-modal [isOpen]="isCreateModalOpen()" title="Ajouter un nouvel utilisateur" (closeModal)="closeCreateModal()">
      <app-register-form
        [cancelRoute]="null"
        (cancel)="closeEditModal()"
        (submitForm)="onCreateSubmit($event)"
      />
    </app-modal>
  </div>
</section>
