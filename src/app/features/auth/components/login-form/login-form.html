<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-5" novalidate>
  @if (errorMessage) {
    <p class="auth-alert">{{ errorMessage }}</p>
  }

  <div class="auth-field">
    <label class="auth-label" for="email">Email</label>
    <input
      id="email"
      type="email"
      formControlName="email"
      class="auth-input"
      [class.auth-input-error]="email?.invalid && email?.touched"
      placeholder="vous@exemple.com"
      autocomplete="email"
    />
    @if (email?.invalid && email?.touched) {
      <span class="auth-error-text">Entrez une adresse email valide.</span>
    }
  </div>

  <div class="auth-field">
    <label class="auth-label" for="password">Mot de passe</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      class="auth-input"
      [class.auth-input-error]="password?.invalid && password?.touched"
      placeholder="••••••••"
      autocomplete="current-password"
    />
    @if (password?.invalid && password?.touched) {
      <span class="auth-error-text">Le mot de passe est requis.</span>
    }
  </div>

  <button type="submit" class="auth-button" [disabled]="loading">
    {{ loading ? 'Connexion...' : 'Se connecter' }}
  </button>

  <p class="text-center text-sm text-[#5B6472]">
    Pas encore de compte ?
    <a routerLink="/auth/register" class="auth-link">Créer un compte</a>
  </p>
</form>
