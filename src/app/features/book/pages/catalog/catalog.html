<section class="section-page-admin">

  <h1 class="text-3xl font-bold mb-6">Catalogue des livres</h1>

  <!-- Filtres -->
  <app-book-filter [authors]="authors()" [categories]="categories()" [editors]="editors()" (filterChange)="filterBooks($event)"></app-book-filter>


  <!-- Liste temporaire des livres -->
  <!---<div class="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
    @for (book of books(); track book.id) {

      <article class="rounded-xl border bg-white p-5 shadow">
        <h2 class="text-xl font-semibold">{{ book.title }}</h2>
        <p class="mt-2 text-gray-600">{{ book.description }}</p>
        <p class="mt-2">ISBN : {{ book.isbn }}</p>
        <p>Langue : {{ book.language }}</p><p>Disponible :{{ book.available ? 'Oui' : 'Non' }}</p>
      </article>

    }
    </div> --->

    <div class="books-grid">

      @for (book of books(); track book.id) {

        <article class="book-card">

          <img src="/images/livre-exemple.jpg" alt="Couverture de {{ book.title }}" class="book-cover">

          <div class="book-info">
            <h2>{{ book.title }}</h2>

            <p class="book-author">
              @for (author of book.authors; track author.id; let last = $last) {
                {{ author.fname }} {{ author.lname }}@if (!last) {, }
              }
            </p>
          </div>

        </article>

      }

  </div>

</section>
