<form [formGroup]="form" (ngSubmit)="onChangePassword()" class="flex flex-col gap-5" novalidate>
  @if (errorMessage()) {
    <p class="form-alert">{{ errorMessage() }}</p>
  }

  <app-form-input
    formControlName="currentPassword"
    label="Mot de passe actuel"
    type="password"
    placeholder="••••••••"
    autocomplete="current-password"
    requiredMessage="Le mot de passe actuel est requis."
  />

  <app-form-input
    formControlName="newPassword"
    label="Nouveau mot de passe"
    type="password"
    placeholder="••••••••"
    autocomplete="new-password"
    requiredMessage="Le nouveau mot de passe est requis."
    patternMessage="6 caractères minimum."
  />

  <app-form-input
    formControlName="confirmPassword"
    label="Confirmer le nouveau mot de passe"
    type="password"
    placeholder="••••••••"
    autocomplete="new-password"
    requiredMessage="La confirmation est requise."
    patternMessage="Les mots de passe ne correspondent pas."
  />

  <div class="flex items-center gap-3 justify-end">
    <a href="/account/" class="btn-secondary no-underline">Annuler</a>
    <button type="submit" class="btn-primary" [disabled]="loading()">
      {{ loading() ? 'Modification...' : 'Modifier le mot de passe' }}
    </button>
  </div>
</form>
